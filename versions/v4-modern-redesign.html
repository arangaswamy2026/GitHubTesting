<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UM Launching Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-color: #c44ba8;
    --primary-light: #d96cc6;
    --text-primary: #191c25;
    --text-secondary: #646464;
    --text-contrast: #ffffff;
    --surface-container: #ffffff;
    --surface-bg: #f5f5f5;
    --border-color: #e0e0e0;
    --sp-2: 8px;
    --sp-3: 16px;
    --sp-4: 24px;
    --sp-5: 32px;
    --sp-6: 48px;
    --radius-2: 4px;
    --radius-4: 12px;
    --radius-full: 88px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--sp-4);
    background: linear-gradient(135deg, #f5f5f5 0%, #efefef 100%);
    font-family: 'Nunito Sans', sans-serif;
    color: var(--text-primary);
    position: relative;
    overflow: hidden;
  }

  body::before,
  body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    opacity: 0.08;
    pointer-events: none;
  }

  body::before {
    width: 400px;
    height: 400px;
    background: var(--primary-color);
    top: -100px;
    left: -100px;
  }

  body::after {
    width: 500px;
    height: 500px;
    background: var(--primary-color);
    bottom: -150px;
    right: -100px;
  }

  main {
    position: relative;
    z-index: 10;
  }

  .card {
    width: 100%;
    max-width: 520px;
    padding: var(--sp-6);
    background: var(--surface-container);
    border-radius: var(--radius-4);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    text-align: center;
  }

  .branding {
    margin-bottom: var(--sp-5);
  }

  .logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: var(--sp-2);
  }

  .logo-accent {
    color: var(--primary-color);
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  h1 {
    margin: 0 0 var(--sp-3);
    font-size: 32px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
  }

  .description {
    margin: 0 0 var(--sp-6);
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: var(--radius-full);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
  }

  .btn--primary {
    background: var(--primary-color);
    color: var(--text-contrast);
  }

  .btn--primary:hover {
    background: var(--primary-light);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(196, 75, 168, 0.25);
  }

  .btn--secondary {
    background: transparent;
    color: var(--text-primary);
    border: 1px solid var(--border-color);
  }

  .btn--secondary:hover {
    background: var(--surface-bg);
    border-color: var(--primary-color);
    color: var(--primary-color);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    margin: var(--sp-4) 0;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-color);
  }

  .link {
    margin-top: var(--sp-4);
    font-size: 14px;
  }

  .link a {
    color: var(--primary-color);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s ease;
  }

  .link a:hover {
    color: var(--primary-light);
    text-decoration: underline;
  }

  @media (max-width: 600px) {
    .card {
      padding: var(--sp-5);
    }

    h1 {
      font-size: 28px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 13px;
    }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="branding">
      <div class="logo"><span class="logo-accent">UM</span> Coming</div>
      <div class="subtitle">Launching Soon</div>
    </div>

    <h1>UM Launching Soon</h1>

    <p class="description">
      This is a placeholder welcome page used to test the flow. Replace this content once the real screen is defined.
    </p>

    <div class="actions">
      <button type="button" class="btn btn--primary">Get started</button>
      <button type="button" class="btn btn--secondary">Skip</button>
    </div>

    <div class="divider">or</div>

    <div class="link">
      <a href="#">Learn more about this release</a>
    </div>
  </main>
</body>
</html>
